{{ define "main" }}

<section class="site-blog-header">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h1>{{ .Title }}</h1>
        <p>
          {{ .Params.description }}
        </p>
      </div>
    </div>
  </div>
</section>

<section class="site-bulletin">
  <div class="container">
    <div class="row">
      {{ range (.Paginator 10).Pages }}
      <div class="col-lg-6">
        <article class="site-bulletin-post">
          <span>{{ .PublishDate.Format "January 2, 2006" }}</span>
          <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
          <p>{{ .Plain | htmlUnescape | truncate 200 }}</p>
          <a href="{{ .Permalink }}" class="read-more">read more</a>
        </article>
      </div>
      {{ end }}
      <div class="col-12">
        <div class="site-project-pagination">
          {{ template "_internal/pagination.html" . }}
        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
